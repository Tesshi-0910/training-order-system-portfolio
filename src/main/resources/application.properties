# ======================================================
# DB接続設定
# ローカル開発ではデフォルト値(localhost:5432 / training_order_db)を使用します。
# 本番(Render等)では環境変数 DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD で上書きします。
# ======================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:training_order_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================================
# JPA / Hibernate 設定
# ======================================================
# update: 起動時にテーブルを自動作成・変更する（開発用）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ======================================================
# Thymeleaf 設定
# ======================================================
# キャッシュをオフにすると HTML 変更がすぐ反映される（開発用）
spring.thymeleaf.cache=false

# ======================================================
# サーバー設定
# Render 等のPaaSは PORT 環境変数でリッスンポートを指定してくる
# ======================================================
server.port=${PORT:8080}

logging.level.org.springframework.security=INFO
